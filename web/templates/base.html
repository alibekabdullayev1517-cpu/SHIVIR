<!DOCTYPE html>
<html lang="{{ lang | default('uz') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06141A">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Shivir{% endblock %}</title>
  <link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v('style.css') }}">
</head>
<body>
  <div class="page">
    <main class="shell{% block shell_class %}{% endblock %}">
      {% include "_brand.html" %}
      {% include "_langswitch.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
