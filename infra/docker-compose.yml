services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shivir
      # Required, no default — fails loudly rather than silently starting
      # Postgres with a blank superuser password. Set in .env (see
      # .env.example) and run compose with --env-file .env from the repo
      # root: `docker compose --env-file .env -f infra/docker-compose.yml up -d`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env — see .env.example}
      POSTGRES_DB: shivir
    ports:
      # Bound to loopback only: reachable as localhost:5432 from the host
      # (where the app's systemd units run — see infra/DEPLOYMENT.md), never
      # from outside the machine. DATABASE_URL is unaffected by this change.
      - "127.0.0.1:5432:5432"
    volumes:
      - shivir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivir -d shivir"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback only — see the postgres service's port comment above.
      # REDIS_URL (redis://localhost:6379/0) is unaffected by this change.
      - "127.0.0.1:6379:6379"
    volumes:
      - shivir_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shivir_postgres_data:
  shivir_redis_data:
